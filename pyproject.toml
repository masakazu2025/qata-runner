[project]
name = "qata-runner"
version = "0.1.0"
description = "qata の runner"
authors = [
    { name = "Masakazu2025", email = "miz.masakazu87@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "jsonschema>=4.26.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    "referencing>=0.37.0",
    "rfc3339-validator>=0.1.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
extend-exclude = ["src/qata_runner/contracts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[project.scripts]
qata-runner = "qata_runner.main:serve"

[tool.importlinter]
root_package = "qata_runner"

[[tool.importlinter.contracts]]
name = "依存は上から下へ：組み立て → 入口（REST）・偽の操作・本物の操作 → 契約の判定・契約の型"
type = "layers"
layers = [
    "qata_runner.main",
    "qata_runner.rest | qata_runner.fake | qata_runner.windows",
    "qata_runner.contract_check | qata_runner.contracts",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.91.0",
    "httpx>=0.28.1",
    "import-linter>=2.16",
    "pytest>=9.2.0",
    "pytest-bdd>=9.0.1",
    "ruff>=0.17.4",
]
